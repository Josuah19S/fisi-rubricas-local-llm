<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro — Rúbricas FISI</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-mark">◆</span> Rúbricas FISI</div>
    <nav class="nav-pills">
      <a class="active" href="/">Registro</a>
      <a href="/generar.html">Generar</a>
    </nav>
    <span id="health" class="health">…</span>
  </header>

  <main class="container">
    <div class="grid-2">
      <section class="card">
        <div class="field">
          <label for="curso">Curso</label>
          <select id="curso"></select>
        </div>
        <div id="arbol" class="tree"></div>
      </section>

      <aside class="card stack">
        <h2>Agregar (solo sesión)</h2>
        <div class="field">
          <label>Entidad</label>
          <select id="entidad">
            <option value="competencias">Competencia</option>
            <option value="logros">Logro</option>
            <option value="capacidades">Capacidad</option>
          </select>
        </div>
        <div class="field" id="f-codigo"><label>Código</label><input id="codigo" placeholder="p. ej. C-XX-01"></div>
        <div class="field" id="f-desc"><label>Descripción</label><input id="descripcion" placeholder="descripción"></div>
        <div class="field hidden" id="f-ref"><label id="ref-label">Ref.</label><input id="ref" placeholder="opcional"></div>
        <div class="field hidden" id="f-unidad"><label>Unidad</label><input id="unidad" placeholder="Unidad I"></div>
        <button id="add" class="btn-primary btn-block">Agregar</button>
        <p class="hint">Los registros agregados viven <strong>solo en esta sesión</strong> y no se guardan en disco. Los sembrados no se modifican.</p>
      </aside>
    </div>

    <details class="card log-drawer">
      <summary>Logs</summary>
      <div id="log" class="log"></div>
    </details>
  </main>

  <script src="/static/app.js"></script>
  <script>
    const added = new Set();

    function applyEntidad() {
      const ent = $("#entidad").value;
      $("#f-ref").classList.toggle("hidden", ent === "competencias");
      $("#f-unidad").classList.toggle("hidden", ent !== "capacidades");
      $("#ref-label").textContent = ent === "logros" ? "codigo_competencia" : "codigo_logro";
    }

    const tag = (codigo) => added.has(codigo) ? '<span class="tag-sesion">sesión</span>' : "";

    async function loadArbol() {
      const id = $("#curso").value;
      if (!id) return;
      logLine(`cargando árbol de ${id}…`);
      const a = await api(`/api/v1/cursos/${id}/arbol`);
      let nlog = 0, ncap = 0;
      let html = `<h2>${a.nombre}</h2><p class="muted">${a.carrera}</p>`;
      for (const c of a.competencias) {
        html += `<details class="node" open>
          <summary class="node-summary">
            <span class="chip chip--comp">${c.codigo}</span>
            <span class="node-title">${c.descripcion}</span>
            <span class="meta">${c.tipo} · ${c.nivel}</span>${tag(c.codigo)}
          </summary>
          <div class="node-body">`;
        for (const l of c.logros) {
          nlog++;
          html += `<div class="node-logro ${added.has(l.codigo) ? "sesion" : ""}">
            <span class="chip chip--logro">${l.codigo}</span>
            <span class="desc">${l.descripcion}</span>${tag(l.codigo)}
            <div class="caps">`;
          for (const cap of l.capacidades) {
            ncap++;
            html += `<span class="chip chip--cap ${added.has(cap.codigo) ? "sesion" : ""}" title="${cap.descripcion}">${cap.codigo}</span>
              <span class="unit">${cap.unidad_aprendizaje}</span>`;
          }
          html += `</div></div>`;
        }
        html += `</div></details>`;
      }
      $("#arbol").innerHTML = html;
      logLine(`árbol: ${a.competencias.length} competencias, ${nlog} logros, ${ncap} capacidades`);
    }

    $("#entidad").addEventListener("change", applyEntidad);
    $("#curso").addEventListener("change", () => loadArbol().catch((e) => logLine("error: " + e.message, "error")));

    $("#add").addEventListener("click", async () => {
      const entidad = $("#entidad").value;
      const data = { codigo: $("#codigo").value.trim(), descripcion: $("#descripcion").value.trim() };
      const ref = $("#ref").value.trim();
      const unidad = $("#unidad").value.trim();
      if (!data.codigo) { logLine("falta el código", "warn"); return; }
      if (entidad === "competencias") { data.tipo = "técnica"; data.nivel = "avanzado"; }
      if (entidad === "logros") { data.codigo_competencia = ref; }
      if (entidad === "capacidades") { data.codigo_logro = ref; data.unidad_aprendizaje = unidad || "Sin unidad"; }
      try {
        logLine(`agregando ${entidad}: ${data.codigo}`);
        await api(`/api/v1/cursos/${$("#curso").value}/${entidad}`, { method: "POST", body: JSON.stringify(data) });
        added.add(data.codigo);
        ["#codigo", "#descripcion", "#ref", "#unidad"].forEach((s) => ($(s).value = ""));
        await loadArbol();
        logLine(`agregado ${data.codigo} (sesión)`);
      } catch (e) { logLine(`error al agregar: ${e.message} (rid ${e.requestId || "-"})`, "error"); }
    });

    applyEntidad();
    (async () => {
      await fillCursos($("#curso"));
      await loadArbol();
    })().catch((e) => logLine("error: " + e.message, "error"));
  </script>
</body>
</html>
